<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="The Adventures of Nuggie & Wormy Club: games, real city facts, life skills, explorer skills and imagination play for kids 7 to 10.">
<meta name="theme-color" content="#139CFF">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>The Adventures of Nuggie & Wormy Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one bright, full-screen cartoon world (sky, drifting clouds, sun, balloon, rolling hills) fixed behind a
   centered phone-width column. Chunky ink-outlined stickers like the show's comic art; one bold color per trail;
   a floating tab bar. Deliberately a single bright daytime look in every theme. */
:root{
  --sky1:#139CFF; --sky2:#4EC4FF; --sky3:#A9E9FF; --grass:#62CF4E; --grass2:#43B23E; --grass3:#2E9A35; --sun:#FFD93B;
  --card:#FFFFFF; --ink:#15223A; --muted:#475A70; --edge:#15223A; --line:#D3E3F2;
  --know:#1F76FF; --know-soft:#E1EDFF; --life:#FF7417; --life-soft:#FFEBDB;
  --explore:#12A657; --explore-soft:#DCF7E7; --imagine:#9A47FF; --imagine-soft:#F0E3FF;
  --gold:#FFC414; --gold-soft:#FFF3C7; --good:#12A657; --bad:#F2364E; --star:#FFC414; --on:#FFFFFF; --pink:#FF4F9A;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Fredoka","Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
  --r:24px; --pop:0 5px 0 var(--edge);
  --outline:0 3px 0 var(--ink),2.5px 0 0 var(--ink),-2.5px 0 0 var(--ink),0 -2.5px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 6px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--sky2);color:var(--ink);font-family:var(--body);font-weight:500;font-size:17px;line-height:1.42;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sky1)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.ico{width:24px;height:24px;flex:none}
.outline{color:#fff;text-shadow:var(--outline)}

/* ---------- the world behind everything ---------- */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 50%,var(--sky3) 100%)}
#world .sun{position:absolute;right:-50px;top:70px;width:190px;height:190px}
#world .sun::before{content:"";position:absolute;inset:-70px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,240,150,.55) 0 10deg,transparent 10deg 22.5deg);animation:spin 40s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 40%,transparent 70%);mask:radial-gradient(circle,#000 40%,transparent 70%)}
#world .sun::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 36%,#FFF3A6,var(--sun) 55%,#FFB800);box-shadow:0 0 60px 20px rgba(255,220,80,.55)}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;left:0;width:150px;height:52px;background:#fff;border-radius:60px;animation:drift linear infinite;opacity:.95}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:66px;height:66px;top:-32px;left:22px}
.cloud::after{width:86px;height:86px;top:-46px;left:58px}
@keyframes drift{from{transform:translateX(-240px) scale(var(--s,1))}to{transform:translateX(calc(100vw + 60px)) scale(var(--s,1))}}
.c1{top:9%;--s:1;animation-duration:70s;animation-delay:-12s}
.c2{top:24%;--s:.7;animation-duration:95s;animation-delay:-60s}
.c3{top:40%;--s:1.25;animation-duration:85s;animation-delay:-35s}
.c4{top:55%;--s:.6;animation-duration:110s;animation-delay:-80s}
.c5{top:16%;--s:.85;animation-duration:120s;animation-delay:-100s}
.balloon{position:absolute;left:6%;top:30%;width:76px;animation:float 14s ease-in-out infinite alternate}
@keyframes float{0%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(40px,-40px) rotate(3deg)}100%{transform:translate(90px,10px) rotate(-2deg)}}
.birds{position:absolute;top:18%;left:0;width:70px;animation:fly 38s linear infinite;animation-delay:-8s}
@keyframes fly{from{transform:translate(-100px,0)}50%{transform:translate(50vw,-30px)}to{transform:translate(calc(100vw + 40px),10px)}}
.birds path{animation:flap .5s ease-in-out infinite alternate;transform-origin:center}
@keyframes flap{to{transform:scaleY(.4)}}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;min-height:170px}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}

.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,var(--sky1),rgba(19,156,255,.88));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:3px solid rgba(21,34,58,.15)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;margin-right:auto;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:50%;background:var(--sun);border:3px solid var(--edge);display:grid;place-items:center;color:var(--ink);flex:none;box-shadow:0 3px 0 var(--edge)}
.brand>span:last-child{min-width:0;display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 2px 0 var(--ink),1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 -1.5px 0 var(--ink)}
.brand small{font-size:9.5px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.14em;text-transform:uppercase;color:#fff;font-weight:700;white-space:nowrap;opacity:.95}
.pill{display:inline-flex;align-items:center;gap:5px;border:3px solid var(--edge);border-radius:999px;background:var(--card);
  padding:3px 10px 3px 6px;font-family:var(--display);font-size:18px;box-shadow:0 3px 0 var(--edge);font-variant-numeric:tabular-nums}
.pill .ico{width:22px;height:22px;color:var(--star);fill:var(--star);stroke:var(--edge);stroke-width:1.5}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.3) rotate(-6deg)}}
.round{width:40px;height:40px;border-radius:50%;border:3px solid var(--edge);background:var(--card);display:grid;place-items:center;box-shadow:0 3px 0 var(--edge);flex:none;color:var(--ink)}
.round.gold{background:var(--gold);color:var(--ink)}

.me{width:44px;height:44px;border-radius:50%;border:3px solid var(--edge);background:var(--sun);padding:0;overflow:hidden;flex:none;box-shadow:0 3px 0 var(--edge);display:grid;place-items:end center}
.me img{width:135%;max-width:none;height:auto;transform:translateY(24%)}
#who{position:fixed;inset:0;z-index:65;background:rgba(10,40,80,.6);display:grid;place-items:center;padding:20px;overflow-y:auto}
#who .card{max-width:400px;width:100%;display:grid;gap:12px;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.kid{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--edge);border-radius:20px;background:var(--card);padding:8px 12px 8px 8px;box-shadow:0 4px 0 var(--edge);font-family:var(--display);font-size:21px}
.kid[aria-current="true"]{background:var(--gold-soft)}
.kid .av{width:58px;height:58px;border-radius:50%;border:3px solid var(--edge);overflow:hidden;flex:none;display:grid;place-items:end center}
.kid .av img{width:135%;max-width:none;transform:translateY(24%)}
.kid small{display:block;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.avpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.avpick button{width:62px;height:62px;border-radius:50%;border:3px solid var(--edge);overflow:hidden;padding:0;display:grid;place-items:end center;box-shadow:0 3px 0 var(--edge)}
.avpick button img{width:135%;max-width:none;transform:translateY(24%)}

.eps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ep{position:relative;text-align:left;border:3px solid var(--edge);border-radius:20px;background:var(--card);box-shadow:var(--pop);padding:0;overflow:hidden;display:flex;flex-direction:column}
.ep .th{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--sky1)}
.ep .th img{width:100%;height:100%;object-fit:cover;display:block}
.ep .th .pl{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.92);border:3px solid var(--edge);display:grid;place-items:center}
.ep .th .len{position:absolute;right:6px;bottom:6px;background:rgba(21,34,58,.85);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}
.ep .tx{padding:8px 10px 10px;display:grid;gap:2px}
.ep .tx b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1}
.ep .tx span{font-size:12.5px;color:var(--muted);font-weight:600}
.ep .seen{position:absolute;left:8px;top:8px;background:var(--good);color:#fff;border:2.5px solid var(--edge);border-radius:99px;font-size:11px;font-weight:700;padding:0 8px}
.ep .soon{position:absolute;left:8px;top:8px;background:#fff;color:var(--ink);border:2.5px solid var(--edge);border-radius:99px;font-size:11px;font-weight:700;padding:0 8px}
.player{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border:3px solid var(--edge);border-radius:18px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- floating tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs .wrap{pointer-events:auto}
.tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:var(--card);border:3px solid var(--edge);border-radius:26px;box-shadow:0 5px 0 var(--edge);padding:6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:18px;font-size:11.5px;min-width:0;font-weight:700;color:var(--muted);transition:transform .15s}
.tab .ico{width:26px;height:26px;color:var(--zc)}
.tab:active{transform:scale(.9)}
.tab[aria-current="page"]{color:#fff;background:var(--zc)}
.tab[aria-current="page"] .ico{color:#fff}

main{padding-block:10px 130px;display:flex;flex-direction:column;gap:20px}
main[hidden]{display:none!important}

/* ---------- shared pieces ---------- */
.card{background:var(--card);border:3px solid var(--edge);border-radius:var(--r);box-shadow:var(--pop);padding:16px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--edge);border-radius:18px;
  background:var(--c,var(--life));color:#fff;font-family:var(--display);font-size:21px;padding:10px 18px;box-shadow:0 5px 0 var(--edge);
  text-decoration:none;min-height:54px;transition:transform .08s;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.ghost{background:var(--card);color:var(--ink);text-shadow:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.dark-text{color:var(--ink);text-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:-6px}
.sec-h h2{font-size:30px;color:#fff;text-shadow:var(--outline)}
.link{background:var(--card);border:3px solid var(--edge);border-radius:99px;color:var(--ink);font-weight:700;text-decoration:none;padding:4px 12px;font-size:14px;box-shadow:0 3px 0 var(--edge);white-space:nowrap}
.bob{animation:bob 2.6s ease-in-out infinite}
.bob.late{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-8px)}}
.hop{animation:hop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes hop{40%{transform:translateY(-26px) rotate(-6deg)}}

/* ---------- Base Camp hero ---------- */
.hero{position:relative;text-align:center;padding-top:8px}
.hero-kicker{font-family:var(--display);font-size:24px;color:#fff;text-shadow:var(--outline);transform:rotate(-2deg)}
.hero-title{font-size:clamp(44px,13vw,70px);line-height:.95;margin-top:4px;color:var(--sun);text-shadow:var(--outline),0 10px 0 rgba(21,34,58,.25);animation:popin .7s cubic-bezier(.3,1.6,.5,1)}
.hero-title .amp{color:#fff;display:inline-block;transform:rotate(-8deg)}
@keyframes popin{from{transform:scale(.85)}}
.club{display:inline-block;margin-top:10px;background:var(--pink);color:#fff;border:3px solid var(--edge);border-radius:99px;padding:3px 18px 4px;font-family:var(--display);font-size:22px;letter-spacing:.18em;box-shadow:0 4px 0 var(--edge);transform:rotate(-3deg)}
.stage{position:relative;height:200px;margin-top:4px}
.stage .mound{position:absolute;left:50%;bottom:0;width:300px;max-width:96%;height:58px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#8BE06C,var(--grass2));border:3px solid var(--edge)}
.stage img{position:absolute;bottom:26px;height:168px;width:auto}
.stage .n{left:50%;margin-left:-150px}
.stage .w{left:50%;margin-left:6px;height:158px}
.spark{position:absolute;width:26px;height:26px;color:var(--sun);animation:twinkle 1.8s ease-in-out infinite}
.spark svg{width:100%;height:100%;fill:currentColor;stroke:var(--ink);stroke-width:1.5}
@keyframes twinkle{50%{transform:scale(.55) rotate(30deg)}}
.hello{display:grid;gap:10px;text-align:left}
.hello h2{font-size:28px}
.bar{height:16px;border-radius:99px;background:var(--line);border:3px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--star) 0 12px,#FFD95E 12px 24px);border-right:3px solid var(--edge);transition:width .6s;animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:34px 0}}
.rankrow{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px}
.rankrow b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--life)}

/* trail name */
.namebox{display:grid;gap:12px;background:var(--gold-soft)}
.namebig{font-family:var(--display);font-size:34px;line-height:1.05;text-align:center;padding:12px;border-radius:18px;background:#fff;border:3px dashed var(--life);color:var(--life)}

/* zones */
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;padding-top:26px}
.zone{position:relative;text-align:left;border:3px solid var(--edge);border-radius:var(--r);background:var(--zc);box-shadow:var(--pop);
  padding:12px 12px 14px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s;transform:rotate(var(--tilt,0deg))}
.zone:nth-child(1){--tilt:-1.5deg}.zone:nth-child(2){--tilt:1.5deg}.zone:nth-child(3){--tilt:1deg}.zone:nth-child(4){--tilt:-1.2deg}
.zone:active{transform:scale(.95) rotate(var(--tilt))}
.zone h3{font-size:23px;color:#fff;text-shadow:0 2px 0 var(--ink),1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 -1.5px 0 var(--ink);position:relative;z-index:1}
.zone span{font-size:13px;color:#fff;font-weight:700;margin-top:2px;position:relative;z-index:1}
.zone img{position:absolute;right:-6px;top:-34px;height:112px;width:auto;filter:drop-shadow(0 4px 0 rgba(21,34,58,.25))}
.zone .tag{position:absolute;left:10px;top:10px;background:#fff;color:var(--ink);border:2.5px solid var(--edge);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;font-style:normal}

/* mission */
.mission{display:flex;gap:12px;align-items:center;background:var(--sun);text-align:left;width:100%}
.mission .medal{width:64px;height:64px;flex:none;animation:bob 2.2s ease-in-out infinite}
.mission h3{font-size:23px}
.mission .eyebrow{color:var(--ink);opacity:.8}

/* passport */
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stamp{border:2.5px dashed var(--line);border-radius:14px;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;text-align:center;color:var(--muted);padding:4px;background:none;line-height:1.12;min-width:0}
.stamp img{height:36px;width:auto;opacity:.2;filter:grayscale(1)}
.stamp.got{border:3px solid var(--know);color:var(--ink);background:var(--know-soft);transform:rotate(-4deg)}
.stamp.got img{opacity:1;filter:none}

/* crew */
.crew{display:flex;gap:12px;overflow-x:auto;padding:30px 4px 12px;scroll-snap-type:x mandatory;margin-inline:-4px}
.mate{position:relative;flex:0 0 112px;scroll-snap-align:start;border:3px solid var(--edge);border-radius:20px;background:var(--mc,#fff);padding:62px 6px 8px;text-align:center;box-shadow:0 4px 0 var(--edge)}
.mate img{position:absolute;left:50%;top:-28px;transform:translateX(-50%);height:96px;width:auto;max-width:110%}
.mate img.hop{animation:hop2 .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes hop2{40%{transform:translateX(-50%) translateY(-24px) rotate(-6deg)}}
.mate b{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:#fff;text-shadow:0 2px 0 var(--ink),1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 -1.5px 0 var(--ink)}
.bubble{position:relative;background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:10px 14px;font-weight:600;box-shadow:0 4px 0 var(--edge)}
.bubble::after{content:"";position:absolute;left:30px;top:-12px;width:18px;height:18px;background:var(--card);border-left:3px solid var(--edge);border-top:3px solid var(--edge);transform:rotate(45deg)}

/* zone page */
.zhead{position:relative;overflow:visible;background:var(--zc);color:#fff;min-height:170px;padding:16px;margin-top:24px}
.zhead h1{font-size:36px;max-width:62%;position:relative;color:#fff;text-shadow:var(--outline)}
.zhead p{max-width:58%;margin-top:8px;position:relative;font-weight:600}
.zhead img{position:absolute;right:-2px;bottom:-4px;height:176px;width:auto}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.act{position:relative;text-align:left;border:3px solid var(--edge);border-radius:22px;background:var(--card);box-shadow:var(--pop);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:156px;transition:transform .15s}
.act:active{transform:scale(.95)}
.act:nth-child(odd){transform:rotate(-.8deg)}.act:nth-child(even){transform:rotate(.8deg)}
.act .badge{width:54px;height:54px}
.act h3{font-size:20px}
.act p{font-size:14px;color:var(--muted);line-height:1.25}
.act .done{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;border:2.5px solid var(--edge)}
.act .done .ico{width:16px;height:16px}
.act.gold{background:var(--gold-soft)}
.act.gold .lockd{position:absolute;right:10px;top:10px;color:var(--ink)}

/* patches */
.patch{width:100%;height:auto;display:block}
.patch.locked{filter:grayscale(1);opacity:.3}
.patches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.pcell{text-align:center;font-size:13px;font-weight:700;line-height:1.2;display:flex;flex-direction:column;gap:6px;align-items:center}
.pcell .patch{max-width:92px}

/* grown-ups + business invite */
.grownups{display:grid;gap:12px;background:var(--card)}
.grownups h2{font-size:26px}
.biz{display:grid;gap:10px}
.bizcard{border:3px solid var(--edge);border-radius:18px;padding:14px;display:grid;gap:6px;box-shadow:0 4px 0 var(--edge);text-decoration:none}
.bizcard b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.bizcard small{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;opacity:.85}
.bizcard p{font-size:15px}
.bizcard .go{justify-self:start;margin-top:4px;border:2.5px solid currentColor;border-radius:99px;padding:3px 12px;font-weight:700;font-size:14px}
.biz-neso{background:#3E1F4F;color:#fff}
.biz-neso .go{color:#F2C14E}
.biz-dc{background:#1E3B33;color:#fff}
.biz-dc .go{color:#E0A93B}
.gate input{width:100%;font:inherit;font-size:24px;padding:10px 12px;border:3px solid var(--edge);border-radius:14px;background:var(--card);color:var(--ink)}

/* sheet (activity player) */
#sheet{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:transparent}
.shead{position:sticky;top:0;z-index:2;background:var(--zc,var(--explore));color:#fff;border-bottom:3px solid var(--edge);padding-top:env(safe-area-inset-top,0px)}
.shead .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.shead h2{font-size:25px;min-width:0;overflow-wrap:anywhere;text-shadow:0 2px 0 var(--ink),1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 -1.5px 0 var(--ink)}
.sbody{padding-block:16px calc(50px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--card);border:3px solid var(--edge);border-radius:28px;box-shadow:var(--pop);padding:18px 16px;display:flex;flex-direction:column;gap:14px}

/* quiz */
.q{font-family:var(--display);font-size:26px;line-height:1.12}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:3px solid var(--edge);border-radius:18px;background:var(--card);padding:13px 14px;font-size:18px;font-weight:600;box-shadow:0 4px 0 var(--edge);min-height:56px;transition:transform .1s}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{border-radius:18px;padding:12px 14px;font-weight:600;border:3px solid var(--edge)}
.feedback.good{background:var(--explore-soft)}
.feedback.bad{background:var(--life-soft)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--edge);background:var(--card)}
.dots i.on{background:var(--zc,var(--explore))}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.flip{perspective:800px;border:0;background:none;padding:0;min-height:176px;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:176px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--edge);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;justify-content:space-between}
.flip .f{background:var(--know);color:#fff}
.flip:nth-child(4n+2) .f{background:var(--imagine)}.flip:nth-child(4n+3) .f{background:var(--life)}.flip:nth-child(4n) .f{background:var(--explore)}
.flip .f b{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.05;text-shadow:0 2px 0 var(--ink)}
.flip .b{background:var(--card);transform:rotateY(180deg);font-size:14px;font-weight:600;line-height:1.3;overflow:auto}

/* timers */
.dial{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:0 auto;border-radius:50%;border:4px solid var(--edge);background:var(--know-soft);display:grid;place-items:center;overflow:hidden;box-shadow:var(--pop)}
.dial b{font-family:var(--display);font-weight:400;font-size:68px;position:relative;z-index:2;font-variant-numeric:tabular-nums}
.dial small{display:block;text-align:center;font-weight:700;color:var(--muted);font-size:14px;position:relative;z-index:2}
.bub{position:absolute;bottom:-30px;border-radius:50%;border:2.5px solid var(--know);background:rgba(255,255,255,.6);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-340px)}}
.big-step{font-family:var(--display);font-size:28px;text-align:center;line-height:1.1}

/* tap tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:3px solid var(--edge);border-radius:16px;background:var(--card);padding:10px 6px;font-weight:700;font-size:14px;min-height:66px;box-shadow:0 3px 0 var(--edge);line-height:1.15}
.tile.in{background:var(--good);color:#fff}
.tile.no{background:var(--bad);color:#fff;animation:shake .35s}
.packbox{border:3px dashed var(--life);border-radius:18px;padding:12px;min-height:72px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:var(--life-soft)}
.chip{border:2.5px solid var(--edge);background:var(--card);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700}

/* coins */
.coins{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.coin{border-radius:50%;border:3px solid var(--edge);display:grid;place-items:center;font-weight:700;color:#2a2116;box-shadow:0 3px 0 var(--edge);padding:0;font-size:14px;line-height:1}
.coin small{display:block;font-size:10px}
.tray{min-height:78px;border:3px dashed var(--line);border-radius:18px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;align-items:center;justify-content:center}
.price{font-family:var(--display);font-size:46px;text-align:center;font-variant-numeric:tabular-nums;color:var(--life)}

/* compass, grid, scene */
.mapcard{background:#F6EFD9;border:3px solid var(--edge);border-radius:18px;padding:10px;box-shadow:var(--pop);color:#1B2A38}
.rose{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:320px;margin:0 auto;width:100%}
.rose button{border:3px solid var(--edge);border-radius:16px;background:var(--card);font-family:var(--display);font-size:22px;min-height:56px;box-shadow:0 3px 0 var(--edge)}
.rose .mid{display:grid;place-items:center;border:0;background:none;box-shadow:none}
.needle{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.ggrid{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:4px;max-width:360px;margin:0 auto;width:100%}
.ggrid .lab{display:grid;place-items:center;font-family:var(--display);font-size:18px}
.gcell{aspect-ratio:1;border:2.5px solid #1B2A38;border-radius:9px;background:#E7F3DA;padding:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#B3261E}
.gcell.hit{background:#8FD47A}
.gcell.miss{background:#F4B4BE}
canvas.scene{width:100%;height:auto;display:block;border:3px solid var(--edge);border-radius:18px;touch-action:none;box-shadow:var(--pop);background:#0b1218}
.flash{width:100%;min-height:150px;border-radius:24px;border:3px solid var(--edge);background:#1B2A38;color:#fff;font-family:var(--display);font-size:26px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:var(--pop);transition:background .06s}
.flash.lit{background:#FFE680;color:#1B2A38}
.code{font-family:var(--display);font-size:36px;text-align:center;letter-spacing:.12em;line-height:1}
.code span{opacity:.3}
.code span.ok{opacity:1;color:var(--good)}

/* story reels */
.reels{display:grid;gap:10px}
.reel{border:3px solid var(--edge);border-radius:18px;background:var(--imagine-soft);padding:10px 14px;box-shadow:0 3px 0 var(--edge)}
.reel small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--imagine)}
.reel b{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.15}
.reel.spin b{filter:blur(1px);opacity:.7}

/* critter creator */
.cc{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.cc>*{min-width:0}
.cc svg{width:min(240px,64vw);height:auto;display:block;margin:0 auto}
.picker{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px}
.picker button{flex:none;border:3px solid var(--edge);border-radius:14px;background:var(--card);padding:6px 12px;font-weight:700;font-size:14px;min-height:44px}
.picker button[aria-pressed="true"]{background:var(--imagine);color:#fff}
.picker .sw{width:42px;height:42px;padding:0;border-radius:50%}
.namecard{border:3px solid var(--edge);border-radius:18px;background:var(--imagine-soft);padding:12px;text-align:center}
.namecard b{font-family:var(--display);font-weight:400;font-size:24px;display:block;line-height:1.1}

/* doodle */
.pad{width:100%;aspect-ratio:4/5;max-height:62vh;border:3px solid var(--edge);border-radius:18px;background:#FFFDF6;touch-action:none;display:block;box-shadow:var(--pop)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid var(--edge);padding:0}
.swatches button[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}

/* jar */
.jar{width:190px;margin:0 auto;display:block;background:none;border:0;padding:0}
.slip{border:3px solid var(--edge);background:#FFF8D6;color:#1B2A38;border-radius:8px 20px 8px 20px;padding:16px;font-family:var(--display);font-size:24px;line-height:1.2;text-align:center;box-shadow:var(--pop);animation:pop .45s}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}

/* gold pass */
.gold-hero{background:var(--gold);color:var(--ink);position:relative;overflow:visible;min-height:180px;margin-top:20px}
.gold-hero h1{font-size:38px;max-width:62%}
.gold-hero p{max-width:58%;margin-top:6px;font-weight:600}
.gold-hero img{position:absolute;right:6px;bottom:-4px;height:150px;width:auto}
.perks{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.perks li{display:flex;gap:10px;align-items:flex-start}
.perks li .ico{color:var(--life);margin-top:1px}
.price-tag{display:flex;align-items:baseline;gap:8px}
.price-tag b{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;color:var(--life)}

/* celebrations */
#cheer{position:fixed;inset:0;z-index:60;background:rgba(10,40,80,.55);display:grid;place-items:center;padding:24px}
#cheer .card{max-width:340px;width:100%;text-align:center;display:grid;gap:12px;justify-items:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
#cheer .patch{width:150px}
#cheer h2{font-size:32px}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;font-weight:700;animation:pop .3s;max-width:calc(100% - 32px);text-align:center;border:3px solid #fff}

footer{font-size:13px;color:var(--ink);text-align:center;display:grid;gap:4px;background:rgba(255,255,255,.85);border:3px solid var(--edge);border-radius:20px;padding:12px 14px;font-weight:600}

@media (max-width:370px){
  .stage img{height:140px}.stage .w{height:132px}.stage .n{margin-left:-128px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand small{display:none}
}
@media (min-width:700px){.zones{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{max-width:760px}.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;

}
